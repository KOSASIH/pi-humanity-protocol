<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pi Humanity Protocol - Pricing</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>Pi.init({ version: "2.0" })</script>
</head>
<body style="margin:0; background:#0a0a0a;">
<section style="font-family:Inter,sans-serif; max-width:900px; margin:40px auto; padding:20px; color:#fff;">
  <h1 style="text-align:center; font-size:32px;">Pi Humanity Protocol Pricing</h1>
  <p style="text-align:center; opacity:0.7;">Secure EU AI Act Compliance<br>All revenue goes to Founder<br><code style="font-size:10px; background:#222; padding:4px 8px; border-radius:4px;">GCKU...XDQN</code></p>
  
  <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(250px,1fr)); gap:20px; margin-top:40px;">
    
    <div style="border:1px solid #333; padding:24px; border-radius:16px;">
      <h3>PIONEER</h3>
      <h2 style="font-size:36px;">0.1 Pi <span style="font-size:14px; opacity:0.6;">/ dossier</span></h2>
      <p style="opacity:0.6; font-size:13px;">Single Article 50/52 Dossier</p>
      <button onclick="payPi(0.1, 'Pioneer Dossier')" style="width:100%; background:#fff; color:#000; padding:12px; border-radius:8px; border:none; margin-top:16px; font-weight:bold; cursor:pointer;">Pay with Pi</button>
    </div>

    <div style="border:2px solid #a855f7; padding:24px; border-radius:16px; background:#111;">
      <span style="background:#a855f7; padding:4px 10px; border-radius:20px; font-size:12px;">MOST POPULAR</span>
      <h3 style="margin-top:12px;">BUILDER</h3>
      <h2 style="font-size:36px;">50 Pi <span style="font-size:14px; opacity:0.6;">/ 100 calls</span></h2>
      <p style="opacity:0.6; font-size:13px;">API access for AI Apps</p>
      <button onclick="payPi(50, 'Builder Plan 100 API Calls')" style="width:100%; background:#a855f7; color:#fff; padding:12px; border-radius:8px; border:none; margin-top:16px; font-weight:bold; cursor:pointer;">Pay 50 Pi to Founder</button>
    </div>

    <div style="border:1px solid #333; padding:24px; border-radius:16px;">
      <h3>ENTERPRISE EU</h3>
      <h2 style="font-size:36px;">€499 <span style="font-size:14px; opacity:0.6;">/ mo</span></h2>
      <p style="opacity:0.6; font-size:13px;">Full compliance coverage</p>
      <a href="https://wa.me/628xxx" style="display:block; text-align:center; border:1px solid #fff; color:#fff; padding:12px; border-radius:8px; text-decoration:none; margin-top:16px; font-weight:bold;">Book Call</a>
    </div>
  </div>
</section>

<script>
const FOUNDER_WALLET = "GCKUNNC6X6LKYJXKTQEJAQQ2J6NTIHMRNJFM2KY6KIBB46BOPMKVXDQN";

async function payPi(amount, memo) {
  const auth = await Pi.authenticate(['payments'], () => {});
  const payment = await Pi.createPayment({
    amount: amount,
    memo: memo + " -> Founder " + FOUNDER_WALLET,
    metadata: { founder_wallet: FOUNDER_WALLET }
  }, {
    onReadyForServerApproval: (id) => fetch('/api/approve', {method:'POST', body:JSON.stringify({paymentId:id})}),
    onReadyForServerCompletion: (id, txid) => {
      alert("Success! TX: " + txid + " -> Founder Wallet");
      fetch('/api/complete', {method:'POST', body:JSON.stringify({paymentId:id, txid})});
    },
    onCancel: () => alert("Cancelled"),
    onError: (e) => alert(e)
  });
}
</script>
</body>
</html>
