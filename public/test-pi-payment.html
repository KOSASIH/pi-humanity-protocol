<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head><body style="font-family:sans-serif;text-align:center;padding:40px">
<h2>Pi Payment Test</h2>
<button id="pay" style="padding:15px 30px;font-size:18px;background:#8a2be2;color:white;border:none;border-radius:10px">PAY 0.01 Pi</button>
<p id="log"></p>
<script>
Pi.init({version:"2.0", sandbox:false});
const log = (m)=>{document.getElementById('log').innerText+=m+"\n"; console.log(m);}

document.getElementById('pay').onclick = async ()=>{
  log("Authenticating...");
  try{
    const auth = await Pi.authenticate(['payments','username'], (p)=>{});
    log("Auth OK: "+auth.user.username);
    
    log("Creating payment...");
    await Pi.createPayment({
      amount: 0.01,
      memo: "Test Humanity Protocol",
      metadata: {test: true}
    },{
      onReadyForServerApproval: async (paymentId)=>{
        log("Ready for approval: "+paymentId);
        const r = await fetch("/api/approve",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({paymentId})
        });
        const j = await r.json();
        log("Approve res: "+r.status+" "+JSON.stringify(j));
        if(!r.ok) throw new Error("Approve failed");
      },
      onReadyForServerCompletion: async (paymentId, txid)=>{
        log("Ready for complete: "+txid);
        const r = await fetch("/api/complete",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({paymentId, txid})
        });
        const j = await r.json();
        log("Complete res: "+r.status+" "+JSON.stringify(j));
      },
      onCancel: (id)=> log("Cancelled: "+id),
      onError: (e,p)=> log("Error: "+e+" "+p),
    });
  }catch(e){ log("ERR: "+e.message); }
};
</script>
</body></html>
