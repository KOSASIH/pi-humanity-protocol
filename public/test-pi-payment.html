<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>Pi.init({version:"2.0",sandbox:true})</script>
</head>
<body style="background:#0f172a;color:#fff;text-align:center;padding:40px;font-family:sans-serif">
<h2>Humanity Protocol - Pi AUTO</h2>
<button onclick="pay()" style="padding:20px 40px;background:#facc15;font-size:20px;border-radius:12px;font-weight:bold;color:#000">PAY 1 TEST-PI</button>
<p id="log" style="margin-top:20px;font-size:18px;word-break:break-all"></p>
<script>
async function pay(){
 try{
  log("Authenticating...");
  await Pi.authenticate(['payments'],()=>{});
  log("Creating payment...");
  await Pi.createPayment({amount:1,memo:"Humanity Protocol Test",metadata:{type:"verify"}},{
   onReadyForServerApproval: async (id)=>{
    log("Approving "+id+"...");
    const r=await fetch('/api/approve',{method:'POST',body:JSON.stringify({paymentId:id})});
    const j=await r.json(); log("Approved! "+JSON.stringify(j).slice(0,150));
   },
   onReadyForServerCompletion: async (id,txid)=>{
    log("Completing "+txid+"...");
    const r=await fetch('/api/complete',{method:'POST',body:JSON.stringify({paymentId:id,txid})});
    const j=await r.json(); log("✅ SUCCESS! Check develop.pi - IT WILL BE GREEN! "+JSON.stringify(j).slice(0,200));
   },
   onCancel: (id)=>log("Cancelled "+id),
   onError: (e)=>log("Error "+e)
  });
 }catch(e){log("Err "+e)}
}
function log(m){document.getElementById('log').innerText=m; console.log(m);}
</script>
</body>
</html>
